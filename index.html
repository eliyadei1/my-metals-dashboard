<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metals & Crypto Pro Dashboard - ILS Edition</title>
    <style>
        :root { --gold: #d4af37; --silver: #c0c0c0; --btc: #f7931a; --bg: #0b0e11; --card: #161a1e; --text: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow: hidden; }
        .dashboard-wrapper { display: grid; grid-template-columns: 280px 1fr 350px; gap: 15px; height: 95vh; }
        .price-sidebar { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .mini-card { background: var(--card); border-radius: 8px; padding: 12px; border: 1px solid #2a2e33; }
        .symbol { font-size: 0.7rem; color: #888; font-weight: bold; }
        .val { font-size: 1.2rem; font-weight: 700; margin-top: 5px; color: #fff; }
        .ils { font-size: 0.9rem; color: #2ecc71; margin-top: 2px; }
        .main-chart, .news-sidebar { background: var(--card); border-radius: 12px; border: 1px solid #2a2e33; display: flex; flex-direction: column; overflow: hidden; }
        .section-header { padding: 12px; background: #1c2127; font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #2a2e33; color: var(--gold); }
        .loading { animation: pulse 1.5s infinite; color: #444; }
        @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <div class="price-sidebar">
        <div class="mini-card" style="border-left: 4px solid var(--gold);"><div class="symbol">GOLD (XAU)</div><div id="XAU" class="val loading">...</div><div id="XAU-ILS" class="ils"></div></div>
        <div class="mini-card" style="border-left: 4px solid var(--silver);"><div class="symbol">SILVER (XAG)</div><div id="XAG" class="val loading">...</div><div id="XAG-ILS" class="ils"></div></div>
        <div class="mini-card" style="border-left: 4px solid #b87333;"><div class="symbol">COPPER (XCU)</div><div id="XCU" class="val loading">...</div><div id="XCU-ILS" class="ils"></div></div>
        <div class="mini-card" style="border-left: 4px solid var(--platinum);"><div class="symbol">PLATINUM (XPT)</div><div id="XPT" class="val loading">...</div><div id="XPT-ILS" class="ils"></div></div>
        <div class="mini-card" style="border-left: 4px solid var(--btc);"><div class="symbol">BITCOIN (BTC)</div><div id="BTC" class="val loading">...</div><div id="BTC-ILS" class="ils"></div></div>
        <div class="mini-card" style="border-left: 4px solid #3498db;"><div class="symbol">XRP</div><div id="XRP" class="val loading">...</div><div id="XRP-ILS" class="ils"></div></div>
    </div>

    <div class="main-chart">
        <div class="section-header">REAL-TIME MARKET CHART</div>
        <div id="tradingview_chart" style="flex:1;"></div>
    </div>

    <div class="news-sidebar">
        <div class="section-header">GLOBAL FINANCIAL NEWS</div>
        <div id="news-container" style="flex:1;"></div>
    </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    const API_KEY = 'goldapi-2783r519mlqxu55j-io';
    let usdToIls = 3.65; // Default fallback

    async function fetchExchangeRate() {
        try {
            const res = await fetch(`https://www.goldapi.io/api/USD/ILS`, { headers: { "x-access-token": API_KEY } });
            const data = await res.json();
            if(data.price) usdToIls = data.price;
        } catch(e) { console.error("Exchange rate error", e); }
    }

    async function updatePrice(symbol) {
        try {
            const res = await fetch(`https://www.goldapi.io/api/${symbol}/USD`, {
                headers: { "x-access-token": API_KEY, "Content-Type": "application/json" }
            });
            const data = await res.json();
            if(data.price) {
                document.getElementById(symbol).innerText = `$${data.price.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById(symbol + '-ILS').innerText = `₪${(data.price * usdToIls).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById(symbol).classList.remove('loading');
            }
        } catch (e) { console.error(symbol, e); }
    }

    function initTradingView() {
        new TradingView.widget({ "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "60", "theme": "dark", "style": "1", "locale": "en", "container_id": "tradingview_chart" });
    }

    function initNews() {
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
        script.async = true;
        script.innerHTML = JSON.stringify({ "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "width": "100%", "height": "100%", "locale": "en" });
        document.getElementById('news-container').appendChild(script);
    }

    async function refreshAll() {
        await fetchExchangeRate();
        ['XAU','XAG','XCU','XPT','BTC','XRP'].forEach(updatePrice);
    }

    initTradingView();
    initNews();
    refreshAll();
    setInterval(refreshAll, 120000); 
</script>
</body>
</html>
