<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Metals & Crypto - Mobile Ready</title>
    <style>
        :root { --gold: #d4af37; --silver: #c0c0c0; --btc: #f7931a; --bg: #0b0e11; --card: #161a1e; --text: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        
        /* Responsive Layout */
        .dashboard-wrapper { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 1024px) { .dashboard-wrapper { grid-template-columns: 300px 1fr 350px; height: 98vh; } }
        
        .column { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .card { background: var(--card); border-radius: 8px; padding: 12px; border: 1px solid #2a2e33; }
        .section-header { padding: 10px; background: #1c2127; font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #333; color: var(--gold); border-radius: 8px 8px 0 0; }
        
        .val { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .ils { font-size: 0.85rem; color: #2ecc71; }
        
        /* Calculator Style */
        .calc-input { width: 100%; padding: 8px; margin: 5px 0; background: #0b0e11; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .calc-result { margin-top: 10px; padding: 10px; background: #1c2127; border-radius: 4px; border-left: 3px solid var(--gold); }

        .loading { animation: pulse 1.5s infinite; color: #444; }
        @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <div class="column">
        <div class="section-header">LIVE PRICES & CALC (ILS)</div>
        <div class="card" style="border-left: 4px solid var(--gold);"><div style="font-size:0.7rem; color:#888;">GOLD (XAU)</div><div id="XAU" class="val loading">...</div><div id="XAU-ILS" class="ils"></div></div>
        <div class="card" style="border-left: 4px solid var(--silver);"><div style="font-size:0.7rem; color:#888;">SILVER (XAG)</div><div id="XAG" class="val loading">...</div><div id="XAG-ILS" class="ils"></div></div>
        <div class="card" style="border-left: 4px solid var(--btc);"><div style="font-size:0.7rem; color:#888;">BITCOIN</div><div id="BTC" class="val loading">...</div><div id="BTC-ILS" class="ils"></div></div>
        
        <div class="card">
            <strong style="font-size:0.8rem; color:var(--gold);">Buy Calculator (Israel)</strong>
            <p style="font-size:0.7rem; color:#888;">Calculates price in ILS including 5% typical premium.</p>
            <input type="number" id="grams" class="calc-input" placeholder="Grams of Gold..." oninput="calculatePrice()">
            <div id="calc-res" class="calc-result" style="font-size:0.85rem;">Result: ₪0.00</div>
        </div>
    </div>

    <div class="column">
        <div class="card" style="flex:1; padding:0; overflow:hidden; min-height: 400px;">
            <div class="section-header">MARKET CHART</div>
            <div id="tradingview_chart" style="height:calc(100% - 40px);"></div>
        </div>
    </div>

    <div class="column">
        <div class="card" style="flex:1; padding:0; overflow:hidden; min-height: 400px;">
            <div class="section-header">GLOBAL NEWS FEED</div>
            <div id="news-container" style="height:calc(100% - 40px);"></div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    const GOLD_API_KEY = 'goldapi-2783r519mlqxu55j-io';
    let usdToIls = 3.65;
    let currentGoldSpot = 0;

    async function fetchExchangeRate() {
        try {
            const res = await fetch(`https://www.goldapi.io/api/USD/ILS`, { headers: { "x-access-token": GOLD_API_KEY } });
            const data = await res.json();
            if(data.price) usdToIls = data.price;
        } catch(e) { console.error(e); }
    }

    async function updateMetal(symbol) {
        try {
            const res = await fetch(`https://www.goldapi.io/api/${symbol}/USD`, { headers: { "x-access-token": GOLD_API_KEY } });
            const data = await res.json();
            if(data.price) {
                document.getElementById(symbol).innerText = `$${data.price.toLocaleString()}`;
                document.getElementById(symbol + '-ILS').innerText = `₪${(data.price * usdToIls).toLocaleString()}`;
                document.getElementById(symbol).classList.remove('loading');
                if(symbol === 'XAU') { currentGoldSpot = data.price; calculatePrice(); }
            }
        } catch (e) { console.error(e); }
    }

    async function updateCrypto() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ripple&vs_currencies=usd');
            const data = await res.json();
            document.getElementById('BTC').innerText = `$${data.bitcoin.usd.toLocaleString()}`;
            document.getElementById('BTC-ILS').innerText = `₪${(data.bitcoin.usd * usdToIls).toLocaleString()}`;
            document.getElementById('BTC').classList.remove('loading');
        } catch (e) { console.error(e); }
    }

    function calculatePrice() {
        const grams = document.getElementById('grams').value || 0;
        const pricePerGram = (currentGoldSpot / 31.1035) * usdToIls; // To ILS per gram
        const total = grams * pricePerGram * 1.05; // Spot + 5% Premium
        document.getElementById('calc-res').innerText = `Result: ₪${total.toLocaleString(undefined, {maximumFractionDigits: 0})}`;
    }

    function initTV() { new TradingView.widget({ "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "60", "theme": "dark", "container_id": "tradingview_chart" }); }
    function initNews() {
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
        script.async = true;
        script.innerHTML = JSON.stringify({ "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "width": "100%", "height": "100%" });
        document.getElementById('news-container').appendChild(script);
    }

    async function refresh() { await fetchExchangeRate(); updateMetal('XAU'); updateMetal('XAG'); updateCrypto(); }

    initTV(); initNews(); refresh();
    setInterval(refresh, 120000);
</script>
</body>
</html>
