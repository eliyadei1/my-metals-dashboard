<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metals & Crypto Pro Dashboard</title>
    <style>
        :root { --gold: #d4af37; --silver: #c0c0c0; --btc: #f7931a; --bg: #0b0e11; --card: #161a1e; --text: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow: hidden; }
        
        .dashboard-wrapper { display: grid; grid-template-columns: 260px 1fr 350px; gap: 15px; height: 95vh; }
        
        /* Sidebar Prices */
        .price-sidebar { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .mini-card { background: var(--card); border-radius: 8px; padding: 12px; border: 1px solid #2a2e33; }
        .symbol { font-size: 0.7rem; color: #888; font-weight: bold; }
        .val { font-size: 1.3rem; font-weight: 700; margin-top: 5px; color: #fff; }
        
        /* Main Content */
        .main-chart { background: var(--card); border-radius: 12px; border: 1px solid #2a2e33; display: flex; flex-direction: column; overflow: hidden; }
        .news-sidebar { background: var(--card); border-radius: 12px; border: 1px solid #2a2e33; overflow: hidden; display: flex; flex-direction: column; }
        
        .section-header { padding: 12px; background: #1c2127; font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #2a2e33; color: var(--gold); }

        .loading { animation: pulse 1.5s infinite; color: #444; }
        @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <div class="price-sidebar">
        <div class="mini-card" style="border-left: 4px solid var(--gold);"><div class="symbol">GOLD (XAU)</div><div id="XAU" class="val loading">...</div></div>
        <div class="mini-card" style="border-left: 4px solid var(--silver);"><div class="symbol">SILVER (XAG)</div><div id="XAG" class="val loading">...</div></div>
        <div class="mini-card" style="border-left: 4px solid #b87333;"><div class="symbol">COPPER (XCU)</div><div id="XCU" class="val loading">...</div></div>
        <div class="mini-card" style="border-left: 4px solid var(--platinum);"><div class="symbol">PLATINUM (XPT)</div><div id="XPT" class="val loading">...</div></div>
        <div class="mini-card" style="border-left: 4px solid var(--btc);"><div class="symbol">BITCOIN (BTC)</div><div id="BTC" class="val loading">...</div></div>
        <div class="mini-card" style="border-left: 4px solid #3498db;"><div class="symbol">XRP</div><div id="XRP" class="val loading">...</div></div>
    </div>

    <div class="main-chart">
        <div class="section-header">REAL-TIME MARKET CHART</div>
        <div class="tradingview-widget-container" style="flex:1;">
            <div id="tradingview_chart" style="height:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({
                "autosize": true,
                "symbol": "OANDA:XAUUSD",
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "save_image": false,
                "container_id": "tradingview_chart"
            });
            </script>
        </div>
    </div>

    <div class="news-sidebar">
        <div class="section-header">GLOBAL FINANCIAL NEWS</div>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
            {
            "feedMode": "all_symbols",
            "colorTheme": "dark",
            "isTransparent": true,
            "displayMode": "regular",
            "width": "100%",
            "height": "100%",
            "locale": "en"
            }
            </script>
        </div>
    </div>
</div>

<script>
    const API_KEY = 'goldapi-2783r519mlqxu55j-io'; 

    async function updatePrice(symbol, id) {
        try {
            const res = await fetch(`https://www.goldapi.io/api/${symbol}/USD`, {
                headers: { "x-access-token": API_KEY, "Content-Type": "application/json" }
            });
            const data = await res.json();
            const element = document.getElementById(id);
            if(element && data.price) {
                element.innerText = `$${data.price.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                element.classList.remove('loading');
            }
        } catch (e) { console.error("Error for " + symbol, e); }
    }

    function refreshAll() {
        updatePrice('XAU', 'XAU');
        updatePrice('XAG', 'XAG');
        updatePrice('XCU', 'XCU');
        updatePrice('XPT', 'XPT');
        updatePrice('BTC', 'BTC');
        updatePrice('XRP', 'XRP');
    }

    refreshAll();
    setInterval(refreshAll, 60000); 
</script>

</body>
</html>
